{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 60px 20px; max-width: 800px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 10px;">{{ post['title'] }}</h1>
    <span style="color: #64748b; margin-bottom: 30px; display: block;">{{ post['date'] }}</span>
    
    <img src="{{ url_for('static', filename='img/' + post['image']) }}" style="width: 100%; border-radius: 12px; margin-bottom: 30px;">
    
    <p style="font-size: 1.1rem; line-height: 1.8;">{{ post['content'] }}</p>
    
    <a href="/blog" style="display: inline-block; margin-top: 40px; color: var(--primary); font-weight: 600;">← Назад в блог</a>
</div>
{% endblock %}
