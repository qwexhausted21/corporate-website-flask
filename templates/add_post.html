{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 60px 20px; max-width: 600px;">
    <h1 style="margin-bottom: 30px;">Добавить новость</h1>
    <form method="POST" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <div class="form-group">
            <label>Заголовок новости</label>
            <input type="text" name="title" required placeholder="Например: Мы запустили новый сервис">
        </div>
        <div class="form-group">
            <label>Название картинки (из папки static/img/)</label>
            <input type="text" name="image" required placeholder="Например: post1.jpg">
        </div>
        <div class="form-group">
            <label>Текст новости</label>
            <textarea name="content" rows="5" required placeholder="Введите текст..."></textarea>
        </div>
        <button type="submit" class="btn">Опубликовать</button>
    </form>
</div>
{% endblock %}
