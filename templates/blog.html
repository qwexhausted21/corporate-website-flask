{% extends 'base.html' %}
{% block content %}
<div class="container blog-section">
    <h1 style="margin-bottom: 40px;">Новости компании</h1>
    
    <div class="grid">
        {% for post in posts %}
        <div class="card">
            <!-- Подтягиваем картинку из базы -->
            <img src="{{ url_for('static', filename='img/' + post['image']) }}" alt="{{ post['title'] }}">
            <div class="card-content">
                <span>{{ post['date'] }}</span>
                <h3>{{ post['title'] }}</h3>
                <a href="/post/{{ post['id'] }}" style="color: var(--primary); font-weight: 600;">Читать →</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
